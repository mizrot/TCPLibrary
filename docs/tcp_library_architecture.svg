<svg xmlns="http://www.w3.org/2000/svg" width="699" height="694" viewBox="0 0 709 694" role="img" style="">
  <title>TCP library thread architecture</title>
  <desc>Three top-level threads (lifecycle, listener, data processor) feeding into a listening socket, spawning per-connection worker threads, which push messages to a shared stack that the data processor pops to invoke user callbacks.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="709" height="694" style="fill:rgb(255,255,255);stroke:none;"/>

  <!-- ═══════════════════════════════════════════════════
       ROW 1: Lifecycle thread (top-center)
       Box: x=262, y=20, w=185, h=58 → cx=354.5, cy=49
       ═══════════════════════════════════════════════════ -->
  <g>
    <rect x="262" y="20" rx="9" ry="9" width="185" height="58"
          fill="#0f6b57" stroke="#2fc59c" stroke-width="1.5"/>
    <text x="354.5" y="41" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#d8d8d8">Lifecycle thread</text>
    <text x="354.5" y="58" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#bdbdbd">User-defined startup/shutdown</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       ROW 2: Listener thread (left) + Data processor (right)
       Listener:  x=80,  y=120, w=185, h=58 → cx=172.5, cy=149
       Data proc: x=444, y=120, w=185, h=58 → cx=536.5, cy=149
       ═══════════════════════════════════════════════════ -->

  <!-- Lifecycle → Listener arrow -->
  <path d="M 310 78 C 270 95, 210 105, 172.5 120"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>

  <!-- Lifecycle → Data processor arrow -->
  <path d="M 399 78 C 440 95, 495 105, 536.5 120"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>

  <!-- Listener thread box -->
  <g>
    <rect x="80" y="120" rx="9" ry="9" width="185" height="58"
          fill="#4b44a6" stroke="#8d86ef" stroke-width="1.5"/>
    <text x="172.5" y="141" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#d8d8d8">Listener thread</text>
    <text x="172.5" y="158" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#bdbdbd">Accepts incoming connections</text>
  </g>

  <!-- Data processor box -->
  <g>
    <rect x="444" y="120" rx="9" ry="9" width="185" height="58"
          fill="#994622" stroke="#ef8b4b" stroke-width="1.5"/>
    <text x="536.5" y="141" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#d8d8d8">Data processor</text>
    <text x="536.5" y="158" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#bdbdbd">Pops stack → user callback</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       Listener → Listening socket
       Listener bottom: (172.5, 178) → socket top: (349.5, 230)
       ═══════════════════════════════════════════════════ -->
  <path d="M 172.5 178 C 172.5 205, 258 225, 303 230"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>

  <!-- ═══════════════════════════════════════════════════
       ROW 3: Listening socket
       Box: x=258, y=230, w=183, h=42 → cx=349.5, cy=251
       ═══════════════════════════════════════════════════ -->
  <g>
    <rect x="258" y="230" rx="8" ry="8" width="183" height="42"
          fill="#515151" stroke="#a4a4a4" stroke-width="1.5"/>
    <text x="349.5" y="251" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#d8d8d8">Listening socket</text>
  </g>

  <!-- spawn thread label -->
  <text x="262" y="310" text-anchor="start" dominant-baseline="auto"
        font-family="Arial,Helvetica,sans-serif" font-size="12" fill="rgb(154,154,154)">spawn thread per connection</text>

  <!-- ═══════════════════════════════════════════════════
       ROW 4: Worker threads
       Worker A: x=78,  y=341, w=145, h=49 → cx=150.5, cy=365.5
       Worker B: x=276, y=341, w=145, h=49 → cx=348.5, cy=365.5
       Worker N: x=474, y=341, w=145, h=49 → cx=546.5, cy=365.5
       Socket bottom: (349.5, 272) → workers top: (150.5/348.5/546.5, 341)
       ═══════════════════════════════════════════════════ -->

  <!-- Socket → Worker A -->
  <path d="M 304 272 C 300 302, 247 317, 150.5 341"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>
  <!-- Socket → Worker B -->
  <path d="M 348.5 272 L 348.5 341"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>
  <!-- Socket → Worker N -->
  <path d="M 395 272 C 419 304, 473 316, 546.5 341"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>

  <!-- Worker A -->
  <g>
    <rect x="78" y="341" rx="9" ry="9" width="145" height="49"
          fill="#4b44a6" stroke="#8d86ef" stroke-width="1.5"/>
    <text x="150.5" y="358" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#d8d8d8">Worker thread</text>
    <text x="150.5" y="375" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#bdbdbd">Client A</text>
  </g>

  <!-- Worker B -->
  <g>
    <rect x="276" y="341" rx="9" ry="9" width="145" height="49"
          fill="#4b44a6" stroke="#8d86ef" stroke-width="1.5"/>
    <text x="348.5" y="358" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#d8d8d8">Worker thread</text>
    <text x="348.5" y="375" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#bdbdbd">Client B</text>
  </g>

  <!-- Worker N -->
  <g>
    <rect x="474" y="341" rx="9" ry="9" width="145" height="49"
          fill="#4b44a6" stroke="#8d86ef" stroke-width="1.5"/>
    <text x="546.5" y="358" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#d8d8d8">Worker thread</text>
    <text x="546.5" y="375" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#bdbdbd">Client N</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       ROW 5: Bottom boxes
       TCP Clients: x=40,  y=460, w=145, h=46 → cx=112.5, cy=483
       Msg stack:   x=222, y=462, w=206, h=62 → cx=325,   cy=493
       ═══════════════════════════════════════════════════ -->

  <!-- TCP Clients ↔ Worker A (dashed recv) -->
  <path d="M 112.5 460 C 132 424, 142 414, 150.5 390"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6" stroke-dasharray="6,6"/>
  <text x="66" y="422" text-anchor="start" dominant-baseline="auto"
        font-family="Arial,Helvetica,sans-serif" font-size="12" fill="rgb(154,154,154)">recv()</text>

  <!-- Worker A → stack -->
  <path d="M 150.5 390 C 188 419, 246 449, 270 462"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>
  <text x="204" y="410" text-anchor="start" dominant-baseline="auto"
        font-family="Arial,Helvetica,sans-serif" font-size="12" fill="rgb(154,154,154)">push(msg)</text>

  <!-- Worker B → stack -->
  <path d="M 348.5 390 L 348.5 462"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>

  <!-- Worker N → stack -->
  <path d="M 546.5 390 C 500 430, 464 447, 422 462"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>

  <!-- TCP Clients box -->
  <g>
    <rect x="40" y="460" rx="8" ry="8" width="145" height="46"
          fill="#6b6b6b" stroke="#a7a7a7" stroke-width="1.5"/>
    <text x="112.5" y="483" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#d8d8d8">TCP Clients</text>
  </g>

  <!-- Message stack box -->
  <g>
    <rect x="222" y="462" rx="8" ry="8" width="206" height="62"
          fill="#985d00" stroke="#d18a00" stroke-width="1.5"/>
    <text x="325" y="485" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#d8d8d8">Message stack</text>
    <text x="325" y="503" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#bdbdbd">Mutex-protected, shared state</text>
  </g>

  <!-- Data processor → stack (pop arrow, sweeps right of canvas) -->
  <path d="M 629 178 Q 680 420, 430 480"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>
  <text x="648" y="316" text-anchor="start" dominant-baseline="auto"
        font-family="Arial,Helvetica,sans-serif" font-size="12" fill="rgb(154,154,154)">pop()</text>

  <!-- ═══════════════════════════════════════════════════
       ROW 6: User callback
       Box: x=466, y=558, w=186, h=52 → cx=559, cy=584
       ═══════════════════════════════════════════════════ -->

  <!-- Stack → user callback -->
  <path d="M 428 524 C 476 532, 496 545, 510 558"
        marker-end="url(#arrow)"
        fill="none" stroke="rgb(154,154,154)" stroke-width="1.6"/>

  <g>
    <rect x="466" y="558" rx="8" ry="8" width="186" height="52"
          fill="#994622" stroke="#ef8b4b" stroke-width="1.5"/>
    <text x="559" y="576" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#d8d8d8">User callback</text>
    <text x="559" y="593" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#bdbdbd">on_message(client, data)</text>
  </g>

</svg>
